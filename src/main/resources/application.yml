spring:
  application:
    name: employee-management-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      # Supabase closes idle connections after ~5 min — keep maxLifetime well below that
      maximum-pool-size: ${DB_MAX_POOL_SIZE:8}
      minimum-idle: ${DB_MIN_IDLE:3}
      max-lifetime: 240000          # 4 min — evict connections before Supabase kills them
      keepalive-time: 60000         # send keepalive ping every 60 s to prevent idle timeout
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: 120000          # evict idle connections after 2 min
      connection-test-query: SELECT 1
      validation-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 0B
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  environment: ${APP_ENVIRONMENT:development}
  cors:
    allowed-origin-patterns: ${ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:3001}
  mail:
    enabled: ${MAIL_ENABLED:false}
    provider: ${MAIL_PROVIDER:GOOGLE_APPS_SCRIPT}
    google-webhook-url: ${GOOGLE_MAIL_WEBHOOK_URL:}
    google-webhook-secret: ${GOOGLE_MAIL_WEBHOOK_SECRET:}
    from-name: ${MAIL_FROM_NAME:Leaflet EMS}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  outbox:
    worker-enabled: ${OUTBOX_WORKER_ENABLED:false}
    poll-interval: ${OUTBOX_POLL_INTERVAL:2s}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    concurrency: ${OUTBOX_WORKER_CONCURRENCY:2}
    processing-timeout: ${OUTBOX_PROCESSING_TIMEOUT:5m}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:6}
    initial-retry: ${OUTBOX_INITIAL_RETRY:1m}
    sent-retention: ${OUTBOX_SENT_RETENTION:30d}
    terminal-retention: ${OUTBOX_TERMINAL_RETENTION:90d}
    sensitive-retention: ${OUTBOX_SENSITIVE_RETENTION:24h}
    provider-connect-timeout: ${OUTBOX_PROVIDER_CONNECT_TIMEOUT:10s}
    provider-read-timeout: ${OUTBOX_PROVIDER_READ_TIMEOUT:20s}
    encryption-key: ${OUTBOX_ENCRYPTION_KEY:local-development-outbox-encryption-key-change-me}
    cleanup-cron: "${OUTBOX_CLEANUP_CRON:0 37 3 * * *}"
    metrics-interval: ${OUTBOX_METRICS_INTERVAL:60s}
  attendance:
    zone-id: ${ATTENDANCE_ZONE_ID:Asia/Kathmandu}
    required-minutes: ${ATTENDANCE_REQUIRED_MINUTES:420}
    grace-minutes: ${ATTENDANCE_GRACE_MINUTES:360}
  policy:
    leave:
      # False preserves the application's existing inclusive calendar-day behavior.
      exclude-weekends: ${LEAVE_EXCLUDE_WEEKENDS:false}
    attendance:
      max-session-minutes: ${ATTENDANCE_MAX_SESSION_MINUTES:1440}
      correction-deadline-days: ${ATTENDANCE_CORRECTION_DEADLINE_DAYS:30}
  security:
    authentication-cache:
      enabled: ${AUTHENTICATION_CACHE_ENABLED:true}
      ttl-seconds: ${AUTHENTICATION_CACHE_TTL_SECONDS:15}
      maximum-entries: ${AUTHENTICATION_CACHE_MAXIMUM_ENTRIES:10000}
    api-rate-limit:
      enabled: ${API_RATE_LIMIT_ENABLED:true}
      read-requests-per-minute: ${API_READ_REQUESTS_PER_MINUTE:120}
      write-requests-per-minute: ${API_WRITE_REQUESTS_PER_MINUTE:30}
      expensive-read-requests-per-minute: ${API_EXPENSIVE_READ_REQUESTS_PER_MINUTE:30}
      export-requests-per-minute: ${API_EXPORT_REQUESTS_PER_MINUTE:10}
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
      issuer: ${JWT_ISSUER:leaflet-ems}
      audience: ${JWT_AUDIENCE:leaflet-ems-web}
      key-id: ${JWT_KEY_ID:local-development-key}
    otp:
      validity-seconds: ${OTP_VALIDITY_SECONDS:600}
      reset-token-validity-seconds: ${RESET_TOKEN_VALIDITY_SECONDS:600}
      resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
      maximum-verification-attempts: ${OTP_MAX_VERIFICATION_ATTEMPTS:5}
      account-issuance-limit-per-minute: ${OTP_ACCOUNT_ISSUANCE_LIMIT_PER_MINUTE:10}
      account-issuance-limit-per-hour: ${OTP_ACCOUNT_ISSUANCE_LIMIT_PER_HOUR:30}
      ip-issuance-limit-per-hour: ${OTP_IP_ISSUANCE_LIMIT_PER_HOUR:100}
      account-issuance-limit-per-day: ${OTP_ACCOUNT_ISSUANCE_LIMIT_PER_DAY:100}
      account-verification-limit-per-fifteen-minutes: ${OTP_ACCOUNT_VERIFICATION_LIMIT_PER_15_MINUTES:20}
      ip-verification-limit-per-fifteen-minutes: ${OTP_IP_VERIFICATION_LIMIT_PER_15_MINUTES:60}
    emergency-admin-bootstrap:
      enabled: ${EMERGENCY_ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${EMERGENCY_ADMIN_BOOTSTRAP_EMAIL:}
      full-name: ${EMERGENCY_ADMIN_BOOTSTRAP_FULL_NAME:Emergency Administrator}
      password: ${EMERGENCY_ADMIN_BOOTSTRAP_PASSWORD:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  media:
    user-hourly-limit: ${MEDIA_USER_HOURLY_LIMIT:30}
    ip-hourly-limit: ${MEDIA_IP_HOURLY_LIMIT:80}
    pending-limit: ${MEDIA_PENDING_LIMIT:5}
    stored-bytes-per-purpose: ${MEDIA_STORED_BYTES_PER_PURPOSE:104857600}
    private-download-ttl-seconds: ${MEDIA_PRIVATE_DOWNLOAD_TTL_SECONDS:120}
    cleanup-cron: "${MEDIA_CLEANUP_CRON:0 17 * * * *}"
    scanner:
      # When false, valid PDFs are marked STRUCTURE_VALIDATED, never CLEAN.
      enabled: ${MEDIA_SCANNER_ENABLED:false}
      # Endpoint settings are used only when scanning is explicitly enabled.
      host: ${MEDIA_SCANNER_HOST:localhost}
      port: ${MEDIA_SCANNER_PORT:3310}
      connect-timeout-ms: ${MEDIA_SCANNER_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${MEDIA_SCANNER_READ_TIMEOUT_MS:15000}

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
